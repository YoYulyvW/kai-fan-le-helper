name: Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide2==5.15.2.1 pyinstaller==5.13.2

      - name: Build EXE (onedir)
        run: pyinstaller --noconfirm --windowed --name KaiFanLe-Helper --win-private-assemblies --distpath build_output --workpath build_temp --specpath build_temp --clean main.py

      - name: Replace dist (remove old, put new zip)
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "build_output\KaiFanLe-Helper\*" `
            -DestinationPath "dist\KaiFanLe-Helper.zip" -Force
          (Get-FileHash "dist\KaiFanLe-Helper.zip" -Algorithm SHA256).Hash `
            | Out-File -Encoding ASCII "dist\KaiFanLe-Helper.zip.sha256"

      - name: Commit & Push
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: update EXE (onedir zip) [skip ci]"
            git push
          } else {
            Write-Host "No changes to commit."
          }
