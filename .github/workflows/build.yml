name: Build Windows Helper

on:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name "KaiFanLeHelper" --clean main.py

      - name: Verify EXE exists
        run: |
          dir dist
          if (-not (Test-Path "dist\KaiFanLeHelper.exe")) {
            Write-Error "EXE not found"
            exit 1
          }
        shell: powershell

      - name: Get EXE size
        run: |
          $size = (Get-Item "dist\KaiFanLeHelper.exe").Length / 1MB
          Write-Host "EXE size: $([math]::Round($size, 2)) MB"
        shell: powershell

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KaiFanLeHelper-Windows
          path: dist/KaiFanLeHelper.exe
          retention-days: 30

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KaiFanLeHelper.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
