name: Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'          # dist 目录变化不触发构建，避免死循环
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide2==5.15.2.1 pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --name KaiFanLe-Helper ^
            --distpath build_output ^
            --workpath build_temp ^
            --specpath build_temp ^
            --clean main.py

      - name: Replace dist (remove old, put new)
        shell: pwsh
        run: |
          # 删除旧的 dist 目录（含旧 exe）
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist | Out-Null
          # 复制新 exe 到 dist（文件名固定，raw 链接不变）
          Copy-Item -Path "build_output\KaiFanLe-Helper.exe" `
                    -Destination "dist\KaiFanLe-Helper.exe" -Force
          # 生成 SHA256 校验文件（可选）
          (Get-FileHash "dist\KaiFanLe-Helper.exe" -Algorithm SHA256).Hash `
            | Out-File -Encoding ASCII "dist\KaiFanLe-Helper.exe.sha256"

      - name: Commit & Push
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/KaiFanLe-Helper.exe dist/KaiFanLe-Helper.exe.sha256
          # 无变化则跳过
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: update EXE [skip ci]"
            git push
          } else {
            Write-Host "No changes to commit."
          }
